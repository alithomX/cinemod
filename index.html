<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMOD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <a href="#" class="logo-link" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
                <img src="https://uploadkon.ir/uploads/ab2a11_26Neon-Green-3D-سینمود-Logo.png" alt="لوگوی سینمو" class="logo-img">
            </a>
        </div>
    </header>

    <main>
        <section id="home" class="hero-section">
            <div class="container">
                <h1 class="hero-title">امروز چه فیلمی به حالت میاد؟</h1>
                <p class="hero-subtitle">حالت رو انتخاب کن، سینمو چند فیلم مناسب برات پیدا می‌کنه.</p>
                <div class="mood-prompt">
                    <h2>الان چه حسی داری؟</h2>
                    <div class="mood-selector" id="moodSelector"></div>
                </div>
                <button class="cta-btn" id="findMovieBtn" disabled>فیلم مناسبم رو پیدا کن</button>
            </div>
        </section>

        <section id="recommendation" class="recommendation-section hidden">
            <div class="container">
                <div class="rec-header">
                    <h2>حال الان: <span id="selectedMoodText"></span></h2>
                    <p>این سه فیلم می‌تونن انتخاب خوبی برای حالت باشن.</p>
                </div>
                <div class="movie-grid" id="recommendationList"></div>
                <div class="rec-feedback">
                    <button id="changeMoodBtn" class="secondary-btn">
                        <span>↻</span><span>یه حال دیگه</span>
                    </button>
                </div>
            </div>
        </section>

        <section id="gallery" class="gallery-section">
            <div class="container">
                <h2 class="section-title">گالری فیلم‌ها</h2>
                <div class="gallery-filters" id="galleryFilters">
                    <select class="filter-select" aria-label="فیلتر ژانر">
                        <option value="all">همه ژانرها</option>
                        <option value="کمدی">کمدی</option>
                        <option value="درام">درام</option>
                        <option value="اکشن">اکشن</option>
                    </select>
                </div>
                <div class="movie-grid" id="galleryList"></div>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>

    <footer class="site-footer">
        <div class="container"><p>&copy; 2026 CINEMO. تمامی حقوق محفوظ است.</p></div>
    </footer>
</body>
</html>
